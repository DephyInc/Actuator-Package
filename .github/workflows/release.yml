name: tagged-release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gh_tagged_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Build
        run: poetry build

      - name: Release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: |
            dist/flexsea*.whl
            dist/flexsea*.tar.gz
