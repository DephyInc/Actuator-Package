name: tagged-release

on:
  push:
    tags:
      - 'v*.*.*'   # glob, not regex

permissions:
  contents: write  # needed to create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gh_tagged_release:
    # extra guard so only proper semver-like tags run
    if: ${{ github.ref_type == 'tag' && github.ref_name matches '^v[0-9]+\\.[0-9]+\\.[0-9]+$' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history if your changelog step needs it
          fetch-tags: true    # make all tags visible to the job

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'     # built-in caching for Poetry deps

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Build
        run: poetry build

      - name: Release
        id: automatic_releases
        # security best practice is to pin to a commit SHA instead of 'latest'
        uses: marvinpinto/action-automatic-releases@<commit-sha>
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: |
            dist/flexsea*.whl
            dist/flexsea*.tar.gz
